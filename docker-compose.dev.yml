services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"    # Metro bundler
      - "19000:19000"  # Expo dev (native endpoints / QR)
      - "19001:19001"  # Dev websockets
      - "19006:19006"  # Web (only if you run web)
    volumes:
      - .:/app              # live code sync
      - /app/node_modules   # keep deps inside container
    environment:
      - HOST=0.0.0.0
      - EXPO_DEV_SERVER_LISTEN_HOST=0.0.0.0
      - EXPO_USE_DEV_SERVER=1
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
      - REACT_NATIVE_PACKAGER_HOSTNAME=host.docker.internal
    working_dir: /app
    # Default command comes from Dockerfile.dev
