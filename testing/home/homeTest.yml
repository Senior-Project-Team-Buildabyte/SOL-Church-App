appId: com.anonymous.SolChurchApp
---
- launchApp
- assertVisible: 'SOL Church'
- takeScreenshot:
    path: LandingScreen
- waitForAnimationToEnd:
    timeout: 2000   # wait up to 2 seconds
- swipe: #Swipe Image Slider on home page  
    start: 90%, 30% # From (90% of width, 50% of height)
    end: 10%, 30% # To (10% of width, 50% of height)
- tapOn: #Click on first dynamic button
    point: 50%,30% 
- takeScreenshot:
    path: FeaturedEvent
- back 
- tapOn: #Click on first dynamic button
    point: 50%,50%  
- back
- tapOn: #Click on second dynamic button
    point: 50%,60%
- takeScreenshot:
    path: SecondDynamicButon 
- back
- tapOn: #Click on third dynamic button
    point: 50%,70%  
- back
- swipe:  #Swipe down to reveal more buttons
    start: 50%, 90%
    end: 50%, 10% 
- takeScreenshot:
    path: LandingScreen2
- tapOn: #Click on fourth dynamic button
    point: 50%,20%  
- back


